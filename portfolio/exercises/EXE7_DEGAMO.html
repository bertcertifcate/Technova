<!DOCTYPE html>
<html>
<head>
    <title>List Tags</title>
</head>
<body>

<h3>Numbered list:</h3>

<ol>
    <li>Apples</li>
    <li>Bananas</li>
    <li>Lemons</li>
    <li>Oranges</li>
</ol>

<h3>Letters list:</h3>

<ol type="A">
    <li>Apples</li>
    <li>Bananas</li>
    <li>Lemons</li>
    <li>Oranges</li>
</ol>

</body>
</html>
