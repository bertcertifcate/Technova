<!DOCTYPE html>
<html>
<head>
    <title>Formatting Tags Demo</title>
</head>
<body>
    <h1>HTML Formatting Tags</h1>
    <ul>
        <li><b>Bold text</b> — &lt;b&gt;</li>
        <li><i>Italic text</i> — &lt;i&gt;</li>
        <li><u>Underlined text</u> — &lt;u&gt;</li>
        <li><strong>Strong emphasis</strong> — &lt;strong&gt;</li>
        <li><em>Emphasized text</em> — &lt;em&gt;</li>
        <li><mark>Highlighted text</mark> — &lt;mark&gt;</li>
        <li><small>Smaller text</small> — &lt;small&gt;</li>
        <li><del>Deleted text</del> — &lt;del&gt;</li>
        <li><ins>Inserted text</ins> — &lt;ins&gt;</li>
        <li>H<sub>2</sub>O — &lt;sub&gt;</li>
        <li>X<sup>2</sup> — &lt;sup&gt;</li>
    </ul>
</body>
</html>
