<!DOCTYPE html>

    <title>Sa Aking Mga Kabata</title>
</head>
<body style="background-color:black; color:white; font-family:Georgia, serif;">

    <h1 style="text-align:center; color:gold;">Sa Aking Mga Kabata</h1>
    
    <!-- Poem excerpt -->
    <p style="text-align:center; color:crimson;">
        <i>"Kapagka the salita'y isang kahatulan sa bayan,</i><br>
        <em>sa nayo't mga kaharian,</em><br>
        <mark>at isang tao'y katulad,</mark><br>
        <small>kabagay ng alin mang likha noong kalayaan."</small>
    </p>

    <!-- Author -->
    <p style="text-align:right; color:gold;">
        — <strong><u>José Rizal</u></strong>
    </p>

</body>
</html>
