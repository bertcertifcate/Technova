<!DOCTYPE html>
<html>
<head>
   <title>Font Tag Attributes</title>
</head>

<body>

   <hl>Font Tag Attributes</hl>

   <font face="Arial" size="5" color="red">
      This text uses Arial Font, size 5, and red color.
   </font>

   <br><br>

   <font face="Times New Roman" size="6" color="blue">
      This text uses Times New Roman font, size 6, and blue color.
   </font>

   <br><br>

   <font face="Courier New" size="4" color="green">
      This text uses Courier New font, size 4, and green color.
   </font>
   
   <br><br>

   <font face="Georgia" size="7" color="purple">
      This text uses Georgia font, size 7, and purple color.
   </font>

</body>
</html>
