<!DOCTYPE html>
<html>
<head>
    <title>List Tags</title>
</head>
<body>

<h3>Lowercase letters list:</h3>

<ol type="a">
    <li>Apples</li>
    <li>Bananas</li>
    <li>Lemons</li>
    <li>Oranges</li>
</ol>

<h3>Roman numbers list:</h3>

<ol type="I">
    <li>Apples</li>
    <li>Bananas</li>
    <li>Lemons</li>
    <li>Oranges</li>
</ol>

<h3>Lowercase Roman numbers list:</h3>

<ol type="i">
    <li>Apples</li>
    <li>Bananas</li>
    <li>Lemons</li>
    <li>Oranges</li>
</ol>

</body>
</html>
